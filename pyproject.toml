[project]
name = "massive-assistant"
version = "0.1.0"
description = "Ассистент для команд виртуальному ассистенту на датасете MASSIVE"
readme = "README.md"
authors = [
    { name = "makschocomint", email = "makschocomint@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
]

[project.scripts]
rg = "massive_assistant.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.0,<1.0.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "T20"]
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=massive_assistant --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["src/massive_assistant"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
